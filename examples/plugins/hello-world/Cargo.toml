[package]
name = "hello-world-plugin"
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
description = "A simple example plugin demonstrating basic Cortex plugin capabilities"
authors = ["Cortex Team <team@cortex.foundation>"]
license = "Apache-2.0"
# Build for WASM target: cargo build --target wasm32-wasi --release

[lib]
crate-type = ["cdylib"]

# Standalone package: not a workspace member of the Cortex CLI tree.
[workspace]

[profile.release]
opt-level = "s"
lto = true
