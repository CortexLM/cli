[package]
name = "cortex-app-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP API server for Cortex - provides REST and WebSocket APIs"

[lib]
name = "cortex_app_server"
path = "src/lib.rs"

[[bin]]
name = "cortex-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Internal
cortex-engine = { workspace = true }
cortex-protocol = { workspace = true }
cortex-common = { workspace = true }

# Web framework
axum = { workspace = true }
tower-http = { workspace = true, features = ["limit"] }

# Async
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "fs", "net", "process", "time"] }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
async-channel = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

# CLI
clap = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
dirs = "5"
fs2 = "0.4"  # File locking for concurrent access

# Authentication
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }

# File watching
notify = { workspace = true }
notify-debouncer-mini = "0.4"

# mDNS/Bonjour service discovery
mdns-sd = { workspace = true }
if-addrs = "0.13"
gethostname = "0.5"

[dev-dependencies]
tower = { workspace = true }
tempfile = { workspace = true }
