[package]
name = "cortex-batch"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Batch operations and MultiEdit tools for Cortex CLI"

[lints]
workspace = true

[dependencies]
cortex-common = { workspace = true }
tokio = { workspace = true, features = ["fs", "time", "sync"] }
