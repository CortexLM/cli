[package]
name = "cortex-linux-sandbox"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Linux sandbox wrapper binary for Cortex CLI"

[[bin]]
name = "cortex-linux-sandbox"
path = "src/main.rs"

[lib]
name = "cortex_linux_sandbox"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
cortex-common = { workspace = true }

# CLI parsing
clap = { workspace = true, features = ["derive"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Landlock
landlock = { workspace = true }

# Seccomp
seccompiler = "0.4"

# Linux libc bindings
libc = { workspace = true }
