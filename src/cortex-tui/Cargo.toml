[package]
name = "cortex-tui"
description = "Cortex CLI terminal user interface built on Cortex engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["audio"]
# Audio notifications - disabled on musl targets due to alsa-sys incompatibility
audio = ["dep:rodio"]

[dependencies]
# Cortex TUI core (the TUI engine)
cortex-core = { workspace = true }

# Auto-update system
cortex-update = { workspace = true }

# Centralized TUI components
cortex-tui-components = { workspace = true }

# TUI capture and debugging (dev/debug feature)
cortex-tui-capture = { workspace = true }

# Cortex business logic
cortex-engine = { workspace = true }
cortex-protocol = { workspace = true }
cortex-common = { workspace = true }
cortex-login = { workspace = true }
cortex-agents = { workspace = true }

# TUI framework
ratatui = { workspace = true }
crossterm = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "process", "time"] }
tokio-stream = { workspace = true }
async-channel = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Utilities
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
hostname = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }

# Clipboard
arboard = { workspace = true }

# File search and fuzzy matching
walkdir = { workspace = true }

# Word-level diffs for Edit tiles
similar = { workspace = true }

# External editor
which = { workspace = true }

# Audio notifications (optional - disabled on musl targets)
rodio = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "generate_tui_lock_screenshots"
path = "src/bin/generate_tui_lock_screenshots.rs"

[[bin]]
name = "generate_tui_demo"
path = "src/bin/generate_tui_demo.rs"
